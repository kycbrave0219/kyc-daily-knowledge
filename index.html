<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="theme-color" content="#f6f7fb" />
<title>KYC 日常知識庫</title>
<style>
:root{
  --bg:#f6f7fb;--card:#fff;--text:#1e2330;--muted:#778096;--line:#e8ebf2;
  --accent:#3559e0;--accent2:#eef2ff;--danger:#d64545;--warn:#a96b00;
  --shadow:0 10px 30px rgba(25,35,70,.07);--r:18px;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans TC",sans-serif}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:780px;margin:auto;min-height:100vh;padding-bottom:92px}
.topbar{position:sticky;top:0;z-index:20;background:rgba(246,247,251,.92);backdrop-filter:blur(14px);padding:14px 16px 10px;border-bottom:1px solid rgba(232,235,242,.9)}
.brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand h1{font-size:21px;margin:0;letter-spacing:.2px}
.brand small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.iconbtn{border:0;background:#fff;border-radius:12px;padding:9px 11px;box-shadow:var(--shadow)}
.searchbox{margin-top:12px;display:flex;gap:8px}
.searchbox input{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;outline:none}
.searchbox input:focus{border-color:#aebaf5;box-shadow:0 0 0 3px #e9edff}
main{padding:14px 16px}
.hero{background:linear-gradient(135deg,#253fb7,#4b6bf0);color:#fff;border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.hero h2{font-size:22px;margin:0 0 7px}.hero p{margin:0;opacity:.9;line-height:1.55;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.stat{background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:19px}.stat span{font-size:12px;opacity:.88}
.section{margin-top:18px}
.section-title{display:flex;justify-content:space-between;align-items:center;margin:0 0 10px}
.section-title h3{font-size:16px;margin:0}.section-title button{border:0;background:none;color:var(--accent)}
.chips{display:flex;gap:8px;overflow:auto;padding:2px 0 5px;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:8px 12px;border-radius:999px;color:#4e566b}
.chip.active{background:var(--text);color:#fff;border-color:var(--text)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:10px;box-shadow:0 3px 14px rgba(25,35,70,.035)}
.cardhead{display:flex;gap:12px;align-items:flex-start}
.cardmain{flex:1;min-width:0}.card h4{margin:0 0 5px;font-size:17px}
.badge{display:inline-block;background:var(--accent2);color:#4055ad;padding:4px 8px;border-radius:999px;font-size:11px;margin-right:5px;margin-bottom:4px}
.badge.pending{background:#fff4d9;color:#8a5b00}
.summary{color:#555f75;line-height:1.55;font-size:14px;margin:7px 0 0}
.meta{display:flex;flex-wrap:wrap;gap:7px;color:var(--muted);font-size:12px;margin-top:9px}
.star{border:0;background:none;font-size:22px;padding:0 0 0 8px;color:#c4cad7}
.star.on{color:#f0a400}
.empty{text-align:center;color:var(--muted);padding:38px 10px}
.fab{position:fixed;right:max(18px,calc((100vw - 780px)/2 + 18px));bottom:86px;z-index:25;border:0;width:56px;height:56px;border-radius:18px;background:var(--accent);color:#fff;font-size:28px;box-shadow:0 12px 28px rgba(53,89,224,.3)}
.bottomnav{position:fixed;z-index:20;bottom:0;left:50%;transform:translateX(-50%);width:min(780px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:rgba(255,255,255,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 5px calc(8px + env(safe-area-inset-bottom))}
.navbtn{border:0;background:none;color:#8a91a1;font-size:11px;padding:5px 2px}.navbtn b{display:block;font-size:18px;margin-bottom:2px}.navbtn.active{color:var(--accent)}
.view{display:none}.view.active{display:block}
.detailtop{display:flex;align-items:center;gap:8px;margin-bottom:12px}.back{border:0;background:#fff;border-radius:12px;padding:9px 12px}
.detailtitle{font-size:24px;margin:6px 0}.aliases{color:var(--muted);font-size:13px}
.notice{background:#fff8e8;border:1px solid #f3dfae;color:#785614;padding:11px 12px;border-radius:13px;font-size:13px;line-height:1.5;margin:12px 0}
details{background:#fff;border:1px solid var(--line);border-radius:15px;margin-bottom:9px;overflow:hidden}
summary{padding:14px 15px;font-weight:650;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
details .content{border-top:1px solid var(--line);padding:13px 15px;color:#4f586d;line-height:1.7;font-size:14px;white-space:pre-wrap}
.source a{color:var(--accent);word-break:break-all}
.actions{display:flex;gap:8px;margin-top:14px}.btn{border:0;border-radius:13px;padding:11px 14px;background:#edf0f6;color:#394055}.btn.primary{background:var(--accent);color:#fff}.btn.danger{background:#fff0f0;color:var(--danger)}
.panel{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px;margin-bottom:12px}
.panel h3{margin:0 0 12px;font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field{margin-bottom:11px}.field label{display:block;font-size:12px;color:#636c7e;margin-bottom:5px}
.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:12px;padding:10px 11px;background:#fff;outline:none}
.field textarea{min-height:92px;resize:vertical}.field input:focus,.field textarea:focus,.field select:focus{border-color:#aebaf5;box-shadow:0 0 0 3px #edf0ff}
.switchline{display:flex;gap:16px;align-items:center;flex-wrap:wrap;font-size:13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
.modal{position:fixed;inset:0;background:rgba(17,22,35,.45);z-index:50;display:none;align-items:flex-end;justify-content:center}
.modal.open{display:flex}
.sheet{background:var(--bg);width:min(780px,100%);max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:15px 16px calc(24px + env(safe-area-inset-bottom))}
.sheethead{position:sticky;top:-15px;background:var(--bg);padding:12px 0 10px;z-index:2;display:flex;align-items:center;justify-content:space-between}
.sheethead h2{font-size:19px;margin:0}.x{border:0;background:#fff;width:38px;height:38px;border-radius:12px}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:#e9ecf3;border-radius:12px;padding:3px;margin-bottom:12px}
.tabs button{border:0;background:transparent;padding:9px;border-radius:10px}.tabs button.active{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.hide{display:none!important}
.smallnote{font-size:12px;color:var(--muted);line-height:1.5}
.listrow{display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);padding:11px 0;gap:12px}
.listrow:first-of-type{border-top:0}
textarea.importbox{min-height:180px}
@media(max-width:520px){.row{grid-template-columns:1fr}.hero{padding:16px}.stats{gap:6px}.stat{padding:9px 5px}.fab{right:16px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div><h1>KYC 日常知識庫</h1><small>想到就存，之後一搜就找得到</small></div>
      <button class="iconbtn" onclick="showView('settings')">⚙️</button>
    </div>
    <div class="searchbox">
      <input id="searchInput" type="search" placeholder="搜尋名詞、別名、標籤、內容…" oninput="onSearch()" />
    </div>
  </header>

  <main>
    <section id="homeView" class="view active">
      <div class="hero">
        <h2>你的生活知識，集中在這裡</h2>
        <p>健康、3C、法律、工作、育兒、食品……不必先想它屬於哪一類，記住關鍵字就能找回來。</p>
        <div class="stats">
          <div class="stat"><b id="statAll">0</b><span>全部知識</span></div>
          <div class="stat"><b id="statPending">0</b><span>待整理</span></div>
          <div class="stat"><b id="statFav">0</b><span>收藏</span></div>
        </div>
      </div>

      <div class="section">
        <div class="section-title"><h3>分類</h3><button onclick="setCategory('全部')">全部</button></div>
        <div id="categoryChips" class="chips"></div>
      </div>

      <div class="section">
        <div class="section-title"><h3 id="listTitle">最近知識</h3><button onclick="showView('knowledge')">查看全部</button></div>
        <div id="homeList"></div>
      </div>
    </section>

    <section id="knowledgeView" class="view">
      <div class="section-title"><h3>全部知識</h3><span class="smallnote" id="resultCount"></span></div>
      <div id="knowledgeList"></div>
    </section>

    <section id="pendingView" class="view">
      <div class="section-title"><h3>待整理</h3><span class="smallnote">先記下名詞，之後再補完整</span></div>
      <div id="pendingList"></div>
    </section>

    <section id="favView" class="view">
      <div class="section-title"><h3>我的收藏</h3><span class="smallnote">常查的內容放這裡</span></div>
      <div id="favList"></div>
    </section>

    <section id="detailView" class="view">
      <div id="detailContent"></div>
    </section>

    <section id="settingsView" class="view">
      <div class="panel">
        <h3>資料備份</h3>
        <div class="toolbar">
          <button class="btn primary" onclick="exportData()">匯出 JSON</button>
          <button class="btn" onclick="document.getElementById('importFile').click()">匯入 JSON</button>
          <input id="importFile" type="file" accept=".json,application/json" class="hide" onchange="importData(event)" />
        </div>
        <p class="smallnote">資料目前儲存在這台裝置的瀏覽器。換手機、清除網站資料或重設瀏覽器前，建議先匯出備份。</p>
      </div>
      <div class="panel">
        <h3>知識卡固定欄位</h3>
        <div class="listrow"><span>基本資料</span><span class="smallnote">名詞、別名、分類、標籤、摘要</span></div>
        <div class="listrow"><span>核心內容</span><span class="smallnote">是什麼、原因、預防、處理</span></div>
        <div class="listrow"><span>延伸資訊</span><span class="smallnote">警訊、誤解、相關名詞、來源、備註</span></div>
      </div>
      <div class="panel">
        <h3>版本</h3>
        <div class="listrow"><span>KYC 日常知識庫</span><b>v0.1</b></div>
      </div>
    </section>
  </main>

  <button class="fab" aria-label="新增知識" onclick="openAdd()">＋</button>

  <nav class="bottomnav">
    <button class="navbtn active" data-view="home" onclick="showView('home')"><b>⌂</b>首頁</button>
    <button class="navbtn" data-view="knowledge" onclick="showView('knowledge')"><b>▤</b>知識</button>
    <button class="navbtn" data-view="pending" onclick="showView('pending')"><b>◷</b>待整理</button>
    <button class="navbtn" data-view="fav" onclick="showView('fav')"><b>★</b>收藏</button>
    <button class="navbtn" data-view="settings" onclick="showView('settings')"><b>⚙</b>設定</button>
  </nav>
</div>

<div id="editorModal" class="modal" onclick="modalBgClose(event)">
  <div class="sheet">
    <div class="sheethead"><h2 id="editorTitle">新增知識</h2><button class="x" onclick="closeEditor()">✕</button></div>
    <div class="tabs">
      <button id="quickTab" class="active" onclick="setEditorTab('quick')">快速記下</button>
      <button id="fullTab" onclick="setEditorTab('full')">完整整理</button>
    </div>

    <div id="quickEditor">
      <div class="panel">
        <div class="field"><label>先記下什麼？</label><input id="qTitle" placeholder="例如：ALT、汗疱疹、CarPlay…" /></div>
        <div class="field"><label>當下想到的關鍵字／問題（可留白）</label><textarea id="qNote" placeholder="例如：正常值多少？為什麼會升高？"></textarea></div>
        <button class="btn primary" style="width:100%" onclick="saveQuick()">存到「待整理」</button>
      </div>
    </div>

    <div id="fullEditor" class="hide">
      <div class="panel">
        <div class="toolbar" style="margin-bottom:12px">
          <button class="btn" onclick="togglePasteBox()">貼上 ChatGPT 整理結果</button>
        </div>
        <div id="pasteWrap" class="hide">
          <div class="field"><label>貼上固定格式內容</label><textarea id="pasteBox" class="importbox" placeholder="名詞：&#10;別名：&#10;主分類：&#10;標籤：&#10;一句話摘要：&#10;這是什麼：&#10;可能原因／誘發因素：&#10;平常怎麼預防／注意：&#10;發生時可以怎麼處理：&#10;什麼情況應就醫：&#10;常見問題／容易誤解：&#10;相關名詞：&#10;資料來源：&#10;我的備註："></textarea></div>
          <button class="btn primary" onclick="applyPasted()">套用到欄位</button>
        </div>
      </div>

      <div class="panel">
        <div class="row">
          <div class="field"><label>名詞 *</label><input id="fTitle" /></div>
          <div class="field"><label>別名／英文／縮寫</label><input id="fAlias" /></div>
        </div>
        <div class="row">
          <div class="field"><label>主分類</label><select id="fCategory"></select></div>
          <div class="field"><label>標籤（逗號分隔）</label><input id="fTags" placeholder="皮膚, 水泡, 搔癢" /></div>
        </div>
        <div class="field"><label>一句話摘要</label><textarea id="fSummary"></textarea></div>
        <div class="switchline">
          <label><input id="fPending" type="checkbox" /> 待整理</label>
          <label><input id="fFav" type="checkbox" /> 加入收藏</label>
        </div>
      </div>

      <div class="panel">
        <div class="field"><label>這是什麼？</label><textarea id="fWhat"></textarea></div>
        <div class="field"><label>可能原因／誘發因素</label><textarea id="fCauses"></textarea></div>
        <div class="field"><label>平常怎麼預防／注意</label><textarea id="fPrevent"></textarea></div>
        <div class="field"><label>發生時可以怎麼處理</label><textarea id="fHandle"></textarea></div>
        <div class="field"><label>什麼情況應該進一步處理／就醫</label><textarea id="fWarning"></textarea></div>
        <div class="field"><label>常見問題／容易誤解</label><textarea id="fMisunderstanding"></textarea></div>
      </div>

      <div class="panel">
        <div class="field"><label>相關名詞（逗號分隔）</label><input id="fRelated" /></div>
        <div class="field"><label>資料來源（每行一筆，可貼網址）</label><textarea id="fSources"></textarea></div>
        <div class="field"><label>我的備註</label><textarea id="fNote"></textarea></div>
        <button class="btn primary" style="width:100%" onclick="saveFull()">儲存知識卡</button>
      </div>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY='kyc_daily_knowledge_v01';
const CATEGORIES=['健康醫療','財經','法律生活','3C科技','工作技術','食品營養','汽機車','育兒教育','居家生活','旅遊交通','其他'];
let state={items:[]};
let selectedCategory='全部';
let currentView='home';
let editingId=null;

function uid(){return 'k'+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function nowDate(){return new Date().toISOString().slice(0,10)}
function esc(s=''){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function normalizeTags(v){return String(v||'').split(/[,，、]/).map(x=>x.trim()).filter(Boolean)}
function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function loadState(){
  const raw=localStorage.getItem(STORAGE_KEY);
  if(raw){try{state=JSON.parse(raw)}catch(e){}}
  if(!state.items || !Array.isArray(state.items))state.items=[];
  if(state.items.length===0){
    state.items=[{
      id:uid(),title:'汗疱疹',alias:'Dyshidrotic eczema／Pompholyx',category:'健康醫療',
      tags:['皮膚','手部','腳部','水泡','搔癢'],summary:'一種常見於手掌、手指側面或腳部、會出現搔癢小水泡的濕疹類型。',
      pending:false,favorite:true,
      what:'汗疱疹（dyshidrotic eczema／pompholyx）是一種濕疹，常在手掌、手指側面或腳部出現小而很癢的水泡。它不是傳染病。',
      causes:'確切原因並不完全清楚。部分人的發作可能與鎳或鈷等過敏原、某些個人清潔用品、手腳常處於潮濕或出汗狀態、壓力、溫熱天氣或其他皮膚問題有關。壓力較適合視為可能誘發或加重因素，而不是單一原因。',
      prevent:'減少長時間濕手、溫和清潔、避免已知刺激物或過敏原，洗手後使用無香料保濕霜或軟膏。若發現某種金屬、清潔用品或工作接觸物會反覆誘發，可記錄並與皮膚科醫師討論。',
      handle:'避免抓破水泡，保持皮膚溫和清潔與保濕。症狀明顯或反覆發作時，治療方式需依嚴重度與診斷決定，可能包含醫師開立的外用藥物或其他治療。',
      warning:'若水泡反覆出現、範圍大、疼痛明顯、影響生活，或出現疑似感染徵象（例如紅腫熱痛加重、流膿等），建議就醫確認。手腳長水泡也可能有其他原因，因此持續或不典型時不宜只靠外觀自行判斷。',
      misunderstanding:'舊稱容易讓人聯想到「汗腺阻塞」，但目前並不認為它是單純由汗腺故障造成。它看起來可能像會傳染的水泡，但汗疱疹本身不具傳染性。',
      related:['濕疹','接觸性皮膚炎','異位性皮膚炎'],
      sources:[
        'https://www.aad.org/public/diseases/eczema/types/dyshidrotic-eczema',
        'https://www.aad.org/public/diseases/eczema/types/dyshidrotic-eczema/causes',
        'https://www.aad.org/public/diseases/eczema/types/dyshidrotic-eczema/self-care',
        'https://www.nhs.uk/conditions/pompholyx/'
      ],
      note:'',created:nowDate(),updated:nowDate()
    }];
    saveState();
  }
}
function render(){
  const q=document.getElementById('searchInput').value.trim().toLowerCase();
  const all=state.items||[];
  document.getElementById('statAll').textContent=all.length;
  document.getElementById('statPending').textContent=all.filter(x=>x.pending).length;
  document.getElementById('statFav').textContent=all.filter(x=>x.favorite).length;

  const chips=['全部',...CATEGORIES];
  document.getElementById('categoryChips').innerHTML=chips.map(c=>`<button class="chip ${selectedCategory===c?'active':''}" onclick="setCategory('${esc(c)}')">${esc(c)}</button>`).join('');

  let filtered=all.filter(x=>{
    const hay=[x.title,x.alias,x.category,(x.tags||[]).join(' '),x.summary,x.what,x.causes,x.prevent,x.handle,x.warning,x.misunderstanding,(x.related||[]).join(' '),x.note].join(' ').toLowerCase();
    return (!q||hay.includes(q)) && (selectedCategory==='全部'||x.category===selectedCategory);
  }).sort((a,b)=>(b.updated||'').localeCompare(a.updated||''));

  document.getElementById('resultCount').textContent=`${filtered.length} 筆`;
  document.getElementById('homeList').innerHTML=cards(filtered.slice(0,6));
  document.getElementById('knowledgeList').innerHTML=cards(filtered);
  document.getElementById('pendingList').innerHTML=cards(filtered.filter(x=>x.pending));
  document.getElementById('favList').innerHTML=cards(filtered.filter(x=>x.favorite));
}
function cards(items){
  if(!items.length)return `<div class="empty">目前沒有符合的資料</div>`;
  return items.map(x=>`
    <article class="card" onclick="openDetail('${x.id}')">
      <div class="cardhead">
        <div class="cardmain">
          <h4>${esc(x.title)}</h4>
          <div>
            <span class="badge">${esc(x.category||'未分類')}</span>
            ${x.pending?'<span class="badge pending">待整理</span>':''}
            ${(x.tags||[]).slice(0,3).map(t=>`<span class="badge">${esc(t)}</span>`).join('')}
          </div>
          ${x.summary?`<p class="summary">${esc(x.summary)}</p>`:''}
          <div class="meta"><span>更新 ${esc(x.updated||'')}</span>${x.alias?`<span>${esc(x.alias)}</span>`:''}</div>
        </div>
        <button class="star ${x.favorite?'on':''}" onclick="event.stopPropagation();toggleFav('${x.id}')">${x.favorite?'★':'☆'}</button>
      </div>
    </article>`).join('');
}
function setCategory(c){selectedCategory=c;render();showView('knowledge')}
function onSearch(){render();if(document.getElementById('searchInput').value.trim())showView('knowledge')}
function showView(v){
  currentView=v;
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  const map={home:'homeView',knowledge:'knowledgeView',pending:'pendingView',fav:'favView',settings:'settingsView',detail:'detailView'};
  document.getElementById(map[v]).classList.add('active');
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===v));
  window.scrollTo({top:0,behavior:'smooth'});
  render();
}
function toggleFav(id){const x=state.items.find(i=>i.id===id);if(!x)return;x.favorite=!x.favorite;x.updated=nowDate();saveState();render();if(currentView==='detail')openDetail(id)}
function section(title,text,cls=''){
  if(!text)return '';
  return `<details open><summary>${esc(title)}</summary><div class="content ${cls}">${text}</div></details>`;
}
function sourceHtml(srcs){
  const rows=(srcs||[]).filter(Boolean).map(s=>{
    const safe=esc(s);
    return /^https?:\/\//i.test(s)?`<div><a href="${safe}" target="_blank" rel="noopener">${safe}</a></div>`:`<div>${safe}</div>`;
  }).join('');
  return rows;
}
function openDetail(id){
  const x=state.items.find(i=>i.id===id);if(!x)return;
  const health=x.category==='健康醫療'?`<div class="notice">健康類內容僅供一般知識整理，不取代醫師診斷；若症狀持續、惡化或不確定，應尋求專業醫療評估。</div>`:'';
  document.getElementById('detailContent').innerHTML=`
    <div class="detailtop"><button class="back" onclick="showView('knowledge')">← 返回</button><div style="flex:1"></div><button class="star ${x.favorite?'on':''}" onclick="toggleFav('${x.id}')">${x.favorite?'★':'☆'}</button></div>
    <div class="card">
      <div class="badge">${esc(x.category||'未分類')}</div>${x.pending?'<div class="badge pending">待整理</div>':''}
      <h2 class="detailtitle">${esc(x.title)}</h2>
      ${x.alias?`<div class="aliases">${esc(x.alias)}</div>`:''}
      ${(x.tags||[]).length?`<div style="margin-top:10px">${x.tags.map(t=>`<span class="badge">${esc(t)}</span>`).join('')}</div>`:''}
      ${x.summary?`<p class="summary" style="font-size:15px">${esc(x.summary)}</p>`:''}
      <div class="meta"><span>建立 ${esc(x.created||'')}</span><span>更新 ${esc(x.updated||'')}</span></div>
    </div>
    ${health}
    ${section('這是什麼？',esc(x.what||''))}
    ${section('可能原因／誘發因素',esc(x.causes||''))}
    ${section('平常怎麼預防／注意',esc(x.prevent||''))}
    ${section('發生時可以怎麼處理',esc(x.handle||''))}
    ${section('什麼情況應該進一步處理／就醫',esc(x.warning||''))}
    ${section('常見問題／容易誤解',esc(x.misunderstanding||''))}
    ${section('相關名詞',(x.related||[]).map(r=>`<span class="badge">${esc(r)}</span>`).join(' '))}
    ${section('資料來源',sourceHtml(x.sources||[]),'source')}
    ${section('我的備註',esc(x.note||''))}
    <div class="actions"><button class="btn primary" onclick="editItem('${x.id}')">修改</button><button class="btn danger" onclick="deleteItem('${x.id}')">刪除</button></div>
  `;
  showView('detail');
}
function openAdd(){editingId=null;clearForm();document.getElementById('editorTitle').textContent='新增知識';setEditorTab('quick');document.getElementById('editorModal').classList.add('open')}
function closeEditor(){document.getElementById('editorModal').classList.remove('open')}
function modalBgClose(e){if(e.target.id==='editorModal')closeEditor()}
function setEditorTab(t){
  document.getElementById('quickTab').classList.toggle('active',t==='quick');
  document.getElementById('fullTab').classList.toggle('active',t==='full');
  document.getElementById('quickEditor').classList.toggle('hide',t!=='quick');
  document.getElementById('fullEditor').classList.toggle('hide',t!=='full');
}
function clearForm(){
  ['qTitle','qNote','fTitle','fAlias','fTags','fSummary','fWhat','fCauses','fPrevent','fHandle','fWarning','fMisunderstanding','fRelated','fSources','fNote','pasteBox'].forEach(id=>{document.getElementById(id).value=''});
  document.getElementById('fPending').checked=false;document.getElementById('fFav').checked=false;
  document.getElementById('fCategory').innerHTML=CATEGORIES.map(c=>`<option>${c}</option>`).join('');
}
function saveQuick(){
  const title=document.getElementById('qTitle').value.trim();if(!title)return alert('請先輸入名詞');
  const note=document.getElementById('qNote').value.trim();
  state.items.unshift({id:uid(),title,alias:'',category:'其他',tags:[],summary:note,pending:true,favorite:false,what:'',causes:'',prevent:'',handle:'',warning:'',misunderstanding:'',related:[],sources:[],note,created:nowDate(),updated:nowDate()});
  saveState();closeEditor();render();showView('pending');
}
function saveFull(){
  const title=document.getElementById('fTitle').value.trim();if(!title)return alert('請輸入名詞');
  const old=editingId?state.items.find(x=>x.id===editingId):null;
  const data={
    id:editingId||uid(),title,alias:document.getElementById('fAlias').value.trim(),
    category:document.getElementById('fCategory').value||'其他',
    tags:normalizeTags(document.getElementById('fTags').value),
    summary:document.getElementById('fSummary').value.trim(),
    pending:document.getElementById('fPending').checked,
    favorite:document.getElementById('fFav').checked,
    what:document.getElementById('fWhat').value.trim(),causes:document.getElementById('fCauses').value.trim(),
    prevent:document.getElementById('fPrevent').value.trim(),handle:document.getElementById('fHandle').value.trim(),
    warning:document.getElementById('fWarning').value.trim(),misunderstanding:document.getElementById('fMisunderstanding').value.trim(),
    related:normalizeTags(document.getElementById('fRelated').value),
    sources:document.getElementById('fSources').value.split('\n').map(x=>x.trim()).filter(Boolean),
    note:document.getElementById('fNote').value.trim(),created:old?.created||nowDate(),updated:nowDate()
  };
  if(editingId){const idx=state.items.findIndex(x=>x.id===editingId);state.items[idx]=data}else state.items.unshift(data);
  saveState();closeEditor();render();openDetail(data.id);
}
function editItem(id){
  const x=state.items.find(i=>i.id===id);if(!x)return;editingId=id;clearForm();setEditorTab('full');
  document.getElementById('editorTitle').textContent='修改知識';
  const v=(id,val)=>document.getElementById(id).value=val||'';
  v('fTitle',x.title);v('fAlias',x.alias);v('fTags',(x.tags||[]).join(', '));v('fSummary',x.summary);v('fWhat',x.what);
  v('fCauses',x.causes);v('fPrevent',x.prevent);v('fHandle',x.handle);v('fWarning',x.warning);v('fMisunderstanding',x.misunderstanding);
  v('fRelated',(x.related||[]).join(', '));v('fSources',(x.sources||[]).join('\n'));v('fNote',x.note);
  document.getElementById('fCategory').value=x.category||'其他';document.getElementById('fPending').checked=!!x.pending;document.getElementById('fFav').checked=!!x.favorite;
  document.getElementById('editorModal').classList.add('open');
}
function deleteItem(id){
  const x=state.items.find(i=>i.id===id);if(!x)return;
  if(!confirm(`確定刪除「${x.title}」？`))return;
  state.items=state.items.filter(i=>i.id!==id);saveState();render();showView('knowledge');
}
function togglePasteBox(){document.getElementById('pasteWrap').classList.toggle('hide')}
function applyPasted(){
  const text=document.getElementById('pasteBox').value;
  if(!text.trim())return;
  const keys=[
    ['名詞','fTitle'],['別名','fAlias'],['主分類','fCategory'],['標籤','fTags'],['一句話摘要','fSummary'],
    ['這是什麼','fWhat'],['可能原因／誘發因素','fCauses'],['平常怎麼預防／注意','fPrevent'],
    ['發生時可以怎麼處理','fHandle'],['什麼情況應就醫','fWarning'],['什麼情況應該進一步處理／就醫','fWarning'],
    ['常見問題／容易誤解','fMisunderstanding'],['相關名詞','fRelated'],['資料來源','fSources'],['我的備註','fNote']
  ];
  const labelPattern=keys.map(k=>k[0].replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).sort((a,b)=>b.length-a.length).join('|');
  const re=new RegExp(`(?:^|\\n)(${labelPattern})[:：]\\s*([\\s\\S]*?)(?=\\n(?:${labelPattern})[:：]|$)`,'g');
  let m;while((m=re.exec(text))){const pair=keys.find(k=>k[0]===m[1]);if(pair)document.getElementById(pair[1]).value=m[2].trim()}
  const cat=document.getElementById('fCategory').value;if(!CATEGORIES.includes(cat))document.getElementById('fCategory').value='其他';
}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`KYC日常知識庫_${nowDate()}.json`;a.click();URL.revokeObjectURL(a.href);
}
function importData(e){
  const f=e.target.files?.[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{
    try{const d=JSON.parse(r.result);if(!d.items||!Array.isArray(d.items))throw new Error();if(!confirm(`將匯入 ${d.items.length} 筆資料並取代目前資料，確定嗎？`))return;state=d;saveState();render();showView('home')}catch(err){alert('這不是有效的知識庫備份檔')}
  };r.readAsText(f);e.target.value='';
}
loadState();clearForm();render();
</script>
</body>
</html>
